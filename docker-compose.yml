version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: calibot-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-calibot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cali-network

  backend:
    build:
      context: ./backend
    container_name: calibot-backend
    restart: always
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 core.wsgi:application
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - cali-network

  bot:
    build:
      context: ./bot
    container_name: calibot-discord
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - cali-network

  frontend:
    build:
      context: ./frontend
    container_name: calibot-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cali-network

networks:
  cali-network:
    driver: bridge

volumes:
  postgres_data:
