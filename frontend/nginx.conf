server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Todas las rutas en React deben redirigirse a index.html para que React Router funcione
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché estático (opcional para performance)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
